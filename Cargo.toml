[package]
name = "buscraft"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
eframe = "0.37.0"
egui = "0.37"
egui_extras = "0.37"
image = { version = "0.25.10", default-features = false, features = ["png"] }
pbkdf2 = "0.13.0"
rfd = "0.18.0"
roxmltree = "0.21.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.2"
socket2 = { version = "0.6", features = ["all"] }
zip = { version = "9.8.2", default-features = false, features = ["aes-crypto", "deflate"] }

[target.'cfg(target_os = "macos")'.dependencies]
winit = "0.30"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
